name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ShuZhai.xcodeproj -scheme ShuZhai -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*App/Sources|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/ShuZhai.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShuZhai.app Payload/
          zip -qry ShuZhai.ipa Payload
          ls -la ShuZhai.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ShuZhai.ipa --prerelease \
            --title "書齋 iPhone 版 $VER（最新）" \
            --notes "用 Sideloadly 安裝 ShuZhai.ipa。版本 $VER，commit ${GITHUB_SHA::7}。"
